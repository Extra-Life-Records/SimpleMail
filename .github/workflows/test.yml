name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_updater.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_mail_refresh.js tests/test_compose_recovery.js tests/test_conversation.js
