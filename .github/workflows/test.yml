name: tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_updater.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_mail_refresh.js tests/test_compose_recovery.js tests/test_conversation.js tests/test_agent_navigation.js
      - name: Verify email privacy in Chromium
        run: |
          $privacyRuntime = Join-Path $env:RUNNER_TEMP 'simplemail-browser-tests'
          npm install --prefix $privacyRuntime --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SIMPLEMAIL_PLAYWRIGHT_MODULE = Join-Path $privacyRuntime 'node_modules/playwright'
          & (Join-Path $privacyRuntime 'node_modules/.bin/playwright.cmd') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/email_privacy_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/owner_review_browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
