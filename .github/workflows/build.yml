name: build

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression checks
        run: |
          python tests/test_updater.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_mail_refresh.js tests/test_compose_recovery.js tests/test_conversation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install packaging dependencies
        run: python -m pip install pywebview==5.3.2 pythonnet==3.0.5 bottle==0.13.4 pillow==12.3.0 cffi==2.1.1 pyinstaller==6.22.3
      - name: Prepare desktop runtime and icon
        run: |
          python patch_pywebview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python make_icon.py
      - name: Build desktop and console agent
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SimpleMail --icon assets/icon.ico --add-data "web;web" --add-data "assets;assets" --add-data "runtimeconfig.json;." --hidden-import webview.platforms.winforms mailapp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --console --name SimpleMailAgent --add-data "runtimeconfig.json;." --hidden-import webview.platforms.winforms agent_mcp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged architecture and isolated agent
        run: python tests/package_smoke.py --arch ${{ matrix.arch }} --directory dist
      - name: Name release downloads
        run: |
          Move-Item -LiteralPath dist/SimpleMail.exe -Destination dist/SimpleMail-${{ matrix.arch }}.exe
          Move-Item -LiteralPath dist/SimpleMailAgent.exe -Destination dist/SimpleMailAgent-${{ matrix.arch }}.exe
          Get-FileHash dist/*-${{ matrix.arch }}.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes
          # Older installed clients choose the first architecture match.
          # Keep desktop assets ahead of the console downloads for those clients.
          gh release upload "$RELEASE_TAG" release/SimpleMail-*.exe
          gh release upload "$RELEASE_TAG" release/SimpleMailAgent-*.exe
          gh release edit "$RELEASE_TAG" --draft=false --latest
