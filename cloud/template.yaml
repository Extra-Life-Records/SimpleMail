AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private Extra Life Records reserved mailboxes (pilot; routing enabled separately)
Parameters:
  OperationalHealthConfig:
    Type: String
    Default: '{}'
    Description: Operator-reviewed JSON for owner-only receiving checks. Empty disables provider reads. See cloud/OPERATIONAL_HEALTH.md.
  OperationalHealthQueueArns:
    Type: CommaDelimitedList
    Default: ''
  OperationalHealthAlarmArns:
    Type: CommaDelimitedList
    Default: ''
  OperationalHealthIdentityArns:
    Type: CommaDelimitedList
    Default: ''
  OperationalHealthFunctionArns:
    Type: CommaDelimitedList
    Default: ''
  McpEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AiSendingEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  HumanSendingEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Separate manual-owner London SES route. Leave disabled until explicitly authorized and sender identities verified.
  McpResourceUrl:
    Type: String
    Default: https://localhost.invalid/mcp
    AllowedPattern: '^https://[^\s#]+/mcp$'
    Description: Existing ApiUrl output followed by /mcp; avoids a circular API-to-function dependency.
  McpCallbackUrl:
    Type: String
    Default: https://localhost.invalid/callback
    AllowedPattern: '^(https://[^\s#]+|http://localhost:[0-9]{1,5}/[^\s#]*)$'
    Description: Exact callback URL supplied by the first AI connector. No wildcard callbacks.
  McpSecondCallbackUrl:
    Type: String
    Default: https://localhost.invalid/callback
    AllowedPattern: '^(https://[^\s#]+|http://localhost:[0-9]{1,5}/[^\s#]*)$'
    Description: Exact callback URL supplied by a second AI connector; it has independent grants.
  Domain:
    Type: String
    Default: extraliferecords.com
  ReceiveDomain:
    Type: String
    Default: inbox.playloudr.com
  MailboxRegistry:
    Type: String
    Default: '{}'
    Description: Reviewed exact-address JSON mapping for additional mail-* IDs and reserved aliases. Does not provision mailboxes or grant AI access.
  AdditionalReceiveRecipients:
    Type: String
    Default: ''
    AllowedPattern: '^([^\s,@]+@[^\s,@]+(,[^\s,@]+@[^\s,@]+)*)?$'
    Description: Optional exact recipient addresses for a separate SES rule; verify domains and registry before activation. Empty preserves current receipt rules.
  AuthDomain:
    Type: String
    Description: Unique Cognito hosted login prefix
  BudgetEmail:
    Type: String
    Default: hello@extraliferecords.com
  SendingEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ApiReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Zero uses the account pool; reserve capacity only when the regional quota permits it.
  CreateSendingIdentity:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after confirming the domain identity does not already exist in this region.
  CallbackUrl:
    Type: String
    Default: http://localhost:8765/callback
    Description: Set to the WebInbox output after first deployment; desktop callback retained.
  ReaderEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create the read-only robot reader (machine app client, separate API, read-only Lambda).
  ReaderMailboxes:
    Type: String
    Default: ''
    AllowedPattern: '^[a-z0-9,-]*$'
    Description: Explicit additional or assigned mailbox IDs the reader may read. Only the original five Reserved inboxes are automatically readable.
  ExternalMailboxesSecret:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+)?$'
    Description: ARN of the owner-created secret holding the Fasthosts logins for the reader (see README). Empty = AWS mailboxes only.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]
    CodeUri: src/
    Environment:
      Variables:
        TABLE: !Ref MailTable
        BUCKET: !Ref MailBucket
        DOMAIN: !Ref Domain
        RECEIVE_DOMAIN: !Ref ReceiveDomain
        MAILBOX_REGISTRY: !Ref MailboxRegistry
Conditions:
  OperationalHealthOn: !Not [!Equals [!Ref OperationalHealthConfig, '{}']]
  HumanSendingOn: !Equals [!Ref HumanSendingEnabled, 'true']
  AdditionalRecipientsOn: !Not [!Equals [!Ref AdditionalReceiveRecipients, '']]
  McpOn: !Equals [!Ref McpEnabled, 'true']
  McpExternalOn: !And [!Condition McpOn, !Not [!Equals [!Ref ExternalMailboxesSecret, '']]]
  ReserveApiCapacity: !Not [!Equals [!Ref ApiReservedConcurrency, 0]]
  WebCallbackConfigured: !Not [!Equals [!Ref CallbackUrl, 'http://localhost:8765/callback']]
  NewSendingIdentity: !Equals [!Ref CreateSendingIdentity, 'true']
  ReaderOn: !Equals [!Ref ReaderEnabled, 'true']
  ExternalOn: !And [!Condition ReaderOn, !Not [!Equals [!Ref ExternalMailboxesSecret, '']]]
Resources:
  MailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 35}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt MailBucket.Arn, !Sub '${MailBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Effect: Allow
            Principal: {Service: ses.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${MailBucket.Arn}/incoming/*'
            Condition:
              StringEquals: {'AWS:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'AWS:SourceArn': !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/*'}
  MailTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: received, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      GlobalSecondaryIndexes:
        - IndexName: Chronological
          KeySchema:
            - {AttributeName: pk, KeyType: HASH}
            - {AttributeName: received, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  Pool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
  PoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomain
      UserPoolId: !Ref Pool
      # Resource-bound access tokens require managed login, not hosted UI v1.
      ManagedLoginVersion: !If [McpOn, 2, 1]
  OwnerLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Condition: McpOn
    DependsOn: PoolDomain
    Properties:
      UserPoolId: !Ref Pool
      ClientId: !Ref Client
      UseCognitoProvidedValues: true
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Pool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, aws.cognito.signin.user.admin]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If [WebCallbackConfigured, [!Ref CallbackUrl, 'http://localhost:8765/callback'], ['http://localhost:8765/callback']]
      LogoutURLs: !If [WebCallbackConfigured, [!Ref CallbackUrl, 'http://localhost:8765/callback'], ['http://localhost:8765/callback']]
      AccessTokenValidity: 5
      IdTokenValidity: 5
      # Keep protected desktop sessions usable across ordinary daily use.
      RefreshTokenValidity: 3650
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 5}
      Auth:
        Authorizers:
          Employee:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}'
              audience: [!Ref Client]
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [openid]
        DefaultAuthorizer: Employee
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: service.api
      MemorySize: 512
      ReservedConcurrentExecutions: !If [ReserveApiCapacity, !Ref ApiReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          SENDING_ENABLED: !Ref SendingEnabled
          CONFIGURATION_SET: !Ref SendingConfiguration
          MCP_ENABLED: !Ref McpEnabled
          OWNER_CLIENT_ID: !Ref Client
          HUMAN_SENDING_ENABLED: !Ref HumanSendingEnabled
          OPERATIONAL_HEALTH_CONFIG: !Ref OperationalHealthConfig
          MCP_CLIENT_IDS: !If [McpOn, !Join [',', [!Ref McpClient, !Ref McpSecondClient]], '']
          EXTERNAL_SECRET: !If [McpExternalOn, !Ref ExternalMailboxesSecret, '']
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MailTable}
        - S3CrudPolicy: {BucketName: !Ref MailBucket}
        - !If
          - OperationalHealthOn
          - Statement:
              - Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !Ref OperationalHealthQueueArns
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: !Ref OperationalHealthAlarmArns
              - Effect: Allow
                Action: ses:GetEmailIdentity
                Resource: !Ref OperationalHealthIdentityArns
              - Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource: !Ref OperationalHealthFunctionArns
              - Effect: Allow
                Action: ses:DescribeActiveReceiptRuleSet
                Resource: '*'
                Condition:
                  StringEquals: {aws:RequestedRegion: !Ref 'AWS::Region'}
          - !Ref 'AWS::NoValue'
        - !If
          - McpExternalOn
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ExternalMailboxesSecret
          - !Ref 'AWS::NoValue'
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}'
                - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SendingConfiguration}'
              Condition:
                StringLike:
                  ses:FromAddress:
                    - !Sub 'one@${Domain}'
                    - !Sub 'two@${Domain}'
                    - !Sub 'three@${Domain}'
                    - !Sub 'four@${Domain}'
                    - !Sub 'five@${Domain}'
      Events:
        Root: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /mailboxes, Method: GET}}
        Mail: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/mailboxes/{proxy+}', Method: ANY}}
        AiSettings: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/ai/{proxy+}', Method: ANY}}
  HumanSendFunction:
    Type: AWS::Serverless::Function
    Condition: HumanSendingOn
    Properties:
      Handler: human_send.api
      MemorySize: 512
      Environment:
        Variables:
          HUMAN_SENDING_ENABLED: !Ref HumanSendingEnabled
          OWNER_CLIENT_ID: !Ref Client
          HUMAN_SENDER_ADDRESSES: 'hello@extraliferecords.com,pippy@extraliferecords.com,playloudr@extraliferecords.com,hello@meandtherobots.com,hello@lightspeedruinedtamworth.co.uk'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: [!GetAtt MailTable.Arn, !Sub '${MailTable.Arn}/index/*']
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt MailTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['mail-*#*']
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${MailBucket.Arn}/*'
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${MailBucket.Arn}/sent/*'
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub 'arn:aws:ses:eu-west-2:${AWS::AccountId}:identity/extraliferecords.com'
                - !Sub 'arn:aws:ses:eu-west-2:${AWS::AccountId}:identity/meandtherobots.com'
                - !Sub 'arn:aws:ses:eu-west-2:${AWS::AccountId}:identity/lightspeedruinedtamworth.co.uk'
              Condition:
                StringEquals:
                  ses:FromAddress: ['hello@extraliferecords.com', 'pippy@extraliferecords.com', 'playloudr@extraliferecords.com', 'hello@meandtherobots.com', 'hello@lightspeedruinedtamworth.co.uk']
      Events:
        Send: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/human/mailboxes/{proxy+}', Method: POST}}
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: web.serve
      Environment:
        Variables:
          CLIENT_ID: !Ref Client
          AUTH_URL: !Sub 'https://${AuthDomain}.auth.${AWS::Region}.amazoncognito.com'
      Events:
        Page: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/ui/{proxy+}', Method: GET, Auth: {Authorizer: NONE}}}
  # Robot reader for headless triage. Its own API, authorizer and Lambda role, so
  # the owner/employee API above is untouched. The role has no SES and no delete,
  # writes only mail rows (never META/ADMIN records) and uploads only drafts.
  ReaderScopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: ReaderOn
    Properties:
      UserPoolId: !Ref Pool
      Identifier: mail-reader
      Name: Mail reader
      Scopes:
        - {ScopeName: read, ScopeDescription: Read mail in unassigned and named mailboxes}
        - {ScopeName: triage, ScopeDescription: 'Move between Inbox and Junk, tag, save review drafts; never send'}
  McpScopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: McpOn
    Properties:
      UserPoolId: !Ref Pool
      Identifier: !Ref McpResourceUrl
      Name: SimpleMail AI connections
      Scopes:
        - {ScopeName: read, ScopeDescription: Read explicitly granted mailboxes}
        - {ScopeName: draft, ScopeDescription: Save drafts for owner review}
        - {ScopeName: send-approved, ScopeDescription: Send only the exact revision approved by the mailbox owner}
  McpClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: McpOn
    DependsOn: McpScopes
    Properties:
      UserPoolId: !Ref Pool
      ClientName: SimpleMail AI connection 1
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !Sub '${McpResourceUrl}/read'
        - !Sub '${McpResourceUrl}/draft'
        - !Sub '${McpResourceUrl}/send-approved'
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref McpCallbackUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 5
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, RefreshToken: days}
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  McpSecondClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: McpOn
    DependsOn: McpScopes
    Properties:
      UserPoolId: !Ref Pool
      ClientName: SimpleMail AI connection 2
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - !Sub '${McpResourceUrl}/read'
        - !Sub '${McpResourceUrl}/draft'
        - !Sub '${McpResourceUrl}/send-approved'
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref McpSecondCallbackUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 5
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, RefreshToken: days}
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  McpLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Condition: McpOn
    DependsOn: PoolDomain
    Properties:
      UserPoolId: !Ref Pool
      ClientId: !Ref McpClient
      UseCognitoProvidedValues: true
  McpSecondLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Condition: McpOn
    DependsOn: PoolDomain
    Properties:
      UserPoolId: !Ref Pool
      ClientId: !Ref McpSecondClient
      UseCognitoProvidedValues: true
  McpFunction:
    Type: AWS::Serverless::Function
    Condition: McpOn
    Properties:
      Handler: remote_mcp.api
      MemorySize: 512
      Environment:
        Variables:
          MCP_RESOURCE: !Ref McpResourceUrl
          MCP_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}'
          MCP_CLIENT_IDS: !Join [',', [!Ref McpClient, !Ref McpSecondClient]]
          EXTERNAL_SECRET: !Ref ExternalMailboxesSecret
          AI_SENDING_ENABLED: !Ref AiSendingEnabled
          SENDING_ENABLED: !Ref SendingEnabled
          CONFIGURATION_SET: !Ref SendingConfiguration
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: [!GetAtt MailTable.Arn, !Sub '${MailTable.Arn}/index/*']
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt MailTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['AI#*', 'APPROVAL#*', 'external#*', 'one#*', 'two#*', 'three#*', 'four#*', 'five#*', 'mail-*#*']
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${MailBucket.Arn}/*'
            - Effect: Allow
              Action: s3:PutObject
              Resource: [!Sub '${MailBucket.Arn}/drafts/*', !Sub '${MailBucket.Arn}/sent/*']
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}'
                - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SendingConfiguration}'
              Condition:
                StringLike:
                  ses:FromAddress: [!Sub 'one@${Domain}', !Sub 'two@${Domain}', !Sub 'three@${Domain}', !Sub 'four@${Domain}', !Sub 'five@${Domain}']
        - !If
          - McpExternalOn
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ExternalMailboxesSecret
          - !Ref 'AWS::NoValue'
      Events:
        Mcp: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /mcp, Method: ANY, Auth: {Authorizer: NONE}}}
        Metadata: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/.well-known/oauth-protected-resource', Method: GET, Auth: {Authorizer: NONE}}}
        PathMetadata: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: '/.well-known/oauth-protected-resource/mcp', Method: GET, Auth: {Authorizer: NONE}}}
  ReaderClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: ReaderOn
    DependsOn: ReaderScopes
    Properties:
      UserPoolId: !Ref Pool
      ClientName: mail-reader
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [mail-reader/read, mail-reader/triage]
      # Machine client only: no password or SRP sign-in for a person.
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      SupportedIdentityProviders: [COGNITO]
      AccessTokenValidity: 60
      TokenValidityUnits: {AccessToken: minutes}
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  ReaderHttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: ReaderOn
    Properties:
      StageName: '$default'
      DefaultRouteSettings: {ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}
      Auth:
        Authorizers:
          Reader:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}'
              audience: [!Ref ReaderClient]
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [mail-reader/read]
        DefaultAuthorizer: Reader
  ReaderFunction:
    Type: AWS::Serverless::Function
    Condition: ReaderOn
    Properties:
      Handler: reader.api
      MemorySize: 512
      Environment:
        Variables: {READER_CLIENT_ID: !Ref ReaderClient, READER_MAILBOXES: !Ref ReaderMailboxes,
                    EXTERNAL_SECRET: !Ref ExternalMailboxesSecret}
      Policies:
        - Statement:
            # Mailbox META rows, mail rows and external#<name> triage rows only;
            # ADMIN and RECEIPT stay unreadable.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: [!GetAtt MailTable.Arn, !Sub '${MailTable.Arn}/index/*']
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: [one, two, three, four, five, 'one#*', 'two#*', 'three#*', 'four#*', 'five#*', 'external#*', 'mail-*']
            # Mail rows only: partition keys are mailbox#generation or external#name.
            # META, ADMIN and RECEIPT records stay out of reach. No DeleteItem.
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt MailTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ['one#*', 'two#*', 'three#*', 'four#*', 'five#*', 'external#*', 'mail-*#*']
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${MailBucket.Arn}/*'
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${MailBucket.Arn}/drafts/*'
            # Fasthosts logins: this one owner-created secret, read only.
            - !If
              - ExternalOn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ExternalMailboxesSecret
              - !Ref AWS::NoValue
      Events:
        Root: {Type: HttpApi, Properties: {ApiId: !Ref ReaderHttpApi, Path: /reader/mailboxes, Method: GET}}
        Mail: {Type: HttpApi, Properties: {ApiId: !Ref ReaderHttpApi, Path: '/reader/mailboxes/{proxy+}', Method: GET}}
        Triage:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReaderHttpApi
            Path: '/reader/mailboxes/{proxy+}'
            Method: POST
            Auth: {Authorizer: Reader, AuthorizationScopes: [mail-reader/triage]}
  ReaderLogs:
    Type: AWS::Logs::LogGroup
    Condition: ReaderOn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {LogGroupName: !Sub '/aws/lambda/${ReaderFunction}', RetentionInDays: 90}
  ReceiveTopic:
    Type: AWS::SNS::Topic
  ReceiveTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref ReceiveTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ses.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref ReceiveTopic
            Condition: {StringEquals: {'AWS:SourceAccount': !Ref 'AWS::AccountId'}}
  ReceiveFailures:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
  Receiver:
    Type: AWS::Serverless::Function
    Properties:
      Handler: service.receive
      Timeout: 60
      MemorySize: 512
      DeadLetterQueue: {Type: SQS, TargetArn: !GetAtt ReceiveFailures.Arn}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MailTable}
        - S3ReadPolicy: {BucketName: !Ref MailBucket}
      Events:
        Received: {Type: SNS, Properties: {Topic: !Ref ReceiveTopic}}
  Rules:
    Type: AWS::SES::ReceiptRuleSet
  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [MailBucketPolicy, ReceiveTopicPolicy]
    Properties:
      RuleSetName: !Ref Rules
      Rule:
        Name: playloudr-reserved
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Require
        Recipients:
          - !Sub 'one@${ReceiveDomain}'
          - !Sub 'two@${ReceiveDomain}'
          - !Sub 'three@${ReceiveDomain}'
          - !Sub 'four@${ReceiveDomain}'
          - !Sub 'five@${ReceiveDomain}'
        Actions:
          - S3Action: {BucketName: !Ref MailBucket, ObjectKeyPrefix: incoming/, TopicArn: !Ref ReceiveTopic}
  ReceiveIdentity:
    Type: AWS::SES::EmailIdentity
    Properties: {EmailIdentity: !Ref ReceiveDomain}
  AdditionalReceiptRule:
    Type: AWS::SES::ReceiptRule
    Condition: AdditionalRecipientsOn
    DependsOn: [MailBucketPolicy, ReceiveTopicPolicy]
    Properties:
      RuleSetName: !Ref Rules
      Rule:
        Name: simplemail-migrated
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Require
        Recipients: !Split [',', !Ref AdditionalReceiveRecipients]
        Actions:
          - S3Action: {BucketName: !Ref MailBucket, ObjectKeyPrefix: incoming/, TopicArn: !Ref ReceiveTopic}
  SendingConfiguration:
    Type: AWS::SES::ConfigurationSet
  SendingIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: NewSendingIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref Domain
      DkimAttributes: {SigningEnabled: true}
      DkimSigningAttributes: {NextSigningKeyLength: RSA_2048_BIT}
      MailFromAttributes:
        MailFromDomain: !Sub 'return-mail.${Domain}'
        BehaviorOnMxFailure: REJECT_MESSAGE
  DeliveryTopic:
    Type: AWS::SNS::Topic
  DeliveryTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref DeliveryTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ses.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref DeliveryTopic
            Condition: {StringEquals: {'AWS:SourceAccount': !Ref 'AWS::AccountId'}}
  SendingEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: DeliveryTopicPolicy
    Properties:
      ConfigurationSetName: !Ref SendingConfiguration
      EventDestination:
        Enabled: true
        MatchingEventTypes: [send, reject, bounce, complaint, delivery, deliveryDelay]
        SnsDestination: {TopicARN: !Ref DeliveryTopic}
  DeliveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: service.delivery
      DeadLetterQueue: {Type: SQS, TargetArn: !GetAtt ReceiveFailures.Arn}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MailTable}
      Events:
        Delivery: {Type: SNS, Properties: {Topic: !Ref DeliveryTopic}}
  DeliveryLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${DeliveryFunction}', RetentionInDays: 14}
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${ApiFunction}', RetentionInDays: 14}
  ReceiverLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${Receiver}', RetentionInDays: 14}
  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${WebFunction}', RetentionInDays: 14}
  FailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt ReceiveFailures.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: playloudr-mail-account-alerts
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 20, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 5, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 10, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 20, ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
Outputs:
  McpUrl:
    Condition: McpOn
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp'
  McpOAuthClientId:
    Condition: McpOn
    Value: !Ref McpClient
  McpSecondOAuthClientId:
    Condition: McpOn
    Value: !Ref McpSecondClient
  ApiUrl: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'}
  WebInbox: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/ui/index.html'}
  Table: {Value: !Ref MailTable}
  Bucket: {Value: !Ref MailBucket}
  UserPool: {Value: !Ref Pool}
  ClientId: {Value: !Ref Client}
  AuthUrl: {Value: !Sub 'https://${AuthDomain}.auth.${AWS::Region}.amazoncognito.com'}
  RuleSet: {Value: !Ref Rules}
  ReaderApiUrl:
    Condition: ReaderOn
    Value: !Sub 'https://${ReaderHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ReaderClientId:
    Condition: ReaderOn
    Value: !Ref ReaderClient
  ReceiveIdentity: {Value: !Ref ReceiveDomain}
  ReceivingDkim1: {Value: !Join [' -> ', [!GetAtt ReceiveIdentity.DkimDNSTokenName1, !GetAtt ReceiveIdentity.DkimDNSTokenValue1]]}
  ReceivingDkim2: {Value: !Join [' -> ', [!GetAtt ReceiveIdentity.DkimDNSTokenName2, !GetAtt ReceiveIdentity.DkimDNSTokenValue2]]}
  ReceivingDkim3: {Value: !Join [' -> ', [!GetAtt ReceiveIdentity.DkimDNSTokenName3, !GetAtt ReceiveIdentity.DkimDNSTokenValue3]]}
  SendingDkim1:
    Condition: NewSendingIdentity
    Value: !Join [' -> ', [!GetAtt SendingIdentity.DkimDNSTokenName1, !GetAtt SendingIdentity.DkimDNSTokenValue1]]
  SendingDkim2:
    Condition: NewSendingIdentity
    Value: !Join [' -> ', [!GetAtt SendingIdentity.DkimDNSTokenName2, !GetAtt SendingIdentity.DkimDNSTokenValue2]]
  SendingDkim3:
    Condition: NewSendingIdentity
    Value: !Join [' -> ', [!GetAtt SendingIdentity.DkimDNSTokenName3, !GetAtt SendingIdentity.DkimDNSTokenValue3]]
